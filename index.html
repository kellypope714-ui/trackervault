<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Arapey&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json"> 
  <style>
    :root {
      --primary: #F88379;
      --bg: #f6e6eb;
      --accent1: #572b46;
      --accent2: #9c6b8f;
      --font: #3c2c3a;
    }

    body {
      margin: 0;
      font-family: 'Arapey', serif;
      background-color: var(--bg);
      color: var(--font);
    }

    header {
      text-align: center;
      padding: 1rem;
      font-family: 'Antic Didone', serif;
      font-size: 2rem;
      color: var(--accent1);
    }

    .folder-grid {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .folder-card {
      background-color: var(--primary);
      border-radius: 12px;
      padding: 2rem;
      width: 200px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-family: 'Antic Didone', serif;
    }

    .folder-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    .folder-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .dashboard {
      display: none;
      padding: 2rem;
    }

    .tracker-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .tracker-card {
      background-color: white;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: box-shadow 0.3s ease;
    }

    .tracker-card:hover {
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    .btn {
      background-color: var(--accent1);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background-color: var(--accent2);
    }

    .modal {
      display: none;
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      z-index: 1000;
      width: 90%;
      max-width: 500px;
    }

    .modal input, .modal textarea, .modal select {
      width: 100%;
      margin-top: 1rem;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--accent2);
      font-family: 'Arapey', serif;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }

    @media (max-width: 768px) {
      .folder-grid {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4hVLMOEegaLOJc-cuGApMEYoEP2pGzOM",
    authDomain: "kellymarieapps.firebaseapp.com",
    projectId: "kellymarieapps",
    storageBucket: "kellymarieapps.firebasestorage.app",
    messagingSenderId: "556407822341",
    appId: "1:556407822341:web:df209f7501cb7ad1d9a46c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
</script>
</head>
<body>
<header>Tracker Vault</header>

<div class="folder-grid" id="mainFolders">
  <div class="folder-card" onclick="openFolder('personal')">
    <div class="folder-icon">📁</div>
    Personal
  </div>
  <div class="folder-card" onclick="openFolder('business')">
    <div class="folder-icon">📁</div>
    Business
  </div>
</div>

<div class="folder-grid" id="subfolders" style="display:none;">
  <div class="folder-card" onclick="openFolder('kpArtwork')">
    <div class="folder-icon">🎨</div>
    KP Artwork
  </div>
  <div class="folder-card" onclick="openFolder('revivedByKP')">
    <div class="folder-icon">🪑</div>
    Revived by KP
  </div>
  <button class="btn" onclick="goHome()">← Back</button>
</div>

<div id="dashboard" class="dashboard">
  <button class="btn" onclick="openModal()">Add Tracker</button>
  <button class="btn" onclick="toggleArchive()">Toggle Archive</button>
  <button class="btn" onclick="goHome()">← Back</button>
  <div id="trackerList" class="tracker-list"></div>
</div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>

<div class="modal" id="modal">
  <h2>Add or Edit Tracker</h2>
  <input type="text" id="title" placeholder="Title" />
  <textarea id="description" placeholder="Description"></textarea>
  <select id="category"></select>
  <input type="text" id="fileLink" placeholder="Paste your file link (GitHub, Drive, etc.)" />
  <input type="file" id="imageUpload" accept="image/*" />
  <button class="btn" onclick="saveTracker()">Save Tracker</button>
  <button class="btn" onclick="closeModal()">Close</button>
</div>
<script>
  let currentFolder = '';
  let isViewingArchive = false;
  let editIndex = null;
  const trackerList = [];

  const categories = {
    personal: ['Financial', 'Drawing Supplies', 'Personal Care'],
    business: ['Financial', 'Inventory', 'Client Info', 'Commissions', 'Time Logging'],
    kpArtwork: ['Financial', 'Inventory', 'Client Info', 'Commissions', 'Time Logging'],
    revivedByKP: ['Financial', 'Inventory', 'Client Info', 'Commissions', 'Time Logging']
  };

  function openFolder(folder) {
    if (folder === 'business') {
      document.getElementById('mainFolders').style.display = 'none';
      document.getElementById('subfolders').style.display = 'flex';
      return;
    }

    currentFolder = folder;
    document.getElementById('mainFolders').style.display = 'none';
    document.getElementById('subfolders').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderTrackers();
  }

  function goHome() {
    currentFolder = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('subfolders').style.display = 'none';
    document.getElementById('mainFolders').style.display = 'flex';
  }

  function openModal(index = null) {
    const categorySelect = document.getElementById('category');
    categorySelect.innerHTML = '';
    categories[currentFolder].forEach(cat => {
      const option = document.createElement('option');
      option.value = cat;
      option.textContent = cat;
      categorySelect.appendChild(option);
    });

    if (index !== null) {
      const tracker = trackerList[index];
      document.getElementById('title').value = tracker.title;
      document.getElementById('description').value = tracker.description;
      document.getElementById('category').value = tracker.category;
      document.getElementById('fileLink').value = tracker.fileLink || '';
      editIndex = index;
    } else {
      clearForm();
      editIndex = null;
    }

    document.getElementById('modal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
    clearForm();
    editIndex = null;
  }

  function clearForm() {
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('category').value = '';
    document.getElementById('fileLink').value = '';
    document.getElementById('imageUpload').value = '';
  }

  function saveTracker() {
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const category = document.getElementById('category').value;
    const fileLink = document.getElementById('fileLink').value;
    const imageFile = document.getElementById('imageUpload').files[0];

    if (!title || !category || !fileLink) return alert('Title, category, and file link are required');

    if (imageFile) {
      const reader = new FileReader();
      reader.onload = function (e) {
        const imageData = e.target.result;
        finalizeSave(title, description, category, fileLink, imageData);
      };
      reader.readAsDataURL(imageFile);
    } else {
      const existingImage = editIndex !== null ? trackerList[editIndex].imageData : null;
      finalizeSave(title, description, category, fileLink, existingImage);
    }
  }

  function finalizeSave(title, description, category, fileLink, imageData) {
    const tracker = {
      title,
      description,
      category,
      fileLink,
      imageData,
      folder: currentFolder,
      archived: false
    };

    if (editIndex !== null) {
      trackerList[editIndex] = tracker;
    } else {
      trackerList.push(tracker);
    }

    saveToStorage();
    closeModal();
    renderTrackers();
  }

  function renderTrackers() {
    const container = document.getElementById('trackerList');
    container.innerHTML = '';
    trackerList
      .filter(t => t.folder === currentFolder && t.archived === isViewingArchive)
      .forEach((tracker, index) => {
        const card = document.createElement('div');
        card.className = 'tracker-card';
        card.innerHTML = `
          ${tracker.imageData ? `<img src="${tracker.imageData}" style="width:100%; max-height:150px; object-fit:cover; border-radius:6px; margin-bottom:0.5rem;" />` : ''}
          <h3>${tracker.title}</h3>
          <p>${tracker.description}</p>
          <p><strong>Category:</strong> ${tracker.category}</p>
          <button class="btn" onclick="openFileLink('${tracker.fileLink}')">Open</button>
          <button class="btn" onclick="openModal(${index})">Edit</button>
          <button class="btn" onclick="deleteTracker(${index})">Delete</button>
          <button class="btn" onclick="archiveTracker(${index})">${tracker.archived ? 'Restore' : 'Archive'}</button>
        `;
        container.appendChild(card);
      });
  }

  function openFileLink(link) {
    window.open(link, '_blank');
  }

  function deleteTracker(index) {
    if (confirm('Are you sure you want to delete this tracker?')) {
      trackerList.splice(index, 1);
      saveToStorage();
      renderTrackers();
    }
  }

  function archiveTracker(index) {
    trackerList[index].archived = !trackerList[index].archived;
    saveToStorage();
    renderTrackers();
  }

  function toggleArchive() {
    isViewingArchive = !isViewingArchive;
    renderTrackers();
  }

import { setDoc, doc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

async function saveTrackers(trackerArray) {
  try {
    await setDoc(doc(db, "Trackervault", "kelly"), {
      trackers: trackerArray
    });
    console.log("Trackers saved to Firestore");
  } catch (error) {
    console.error("Error saving trackers:", error);
  }
}

import { getDoc, doc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

async function loadTrackers() {
  try {
    const docSnap = await getDoc(doc(db, "Trackervault", "kelly"));
    if (docSnap.exists()) {
      const data = docSnap.data();
      const trackerArray = data.trackers || [];
      console.log("Loaded trackers:", trackerArray);
      // Render trackerArray into your app here
    } else {
      console.log("No tracker data found");
    }
  } catch (error) {
    console.error("Error loading trackers:", error);
     });
  }
}
</script>
</body>
</html>
